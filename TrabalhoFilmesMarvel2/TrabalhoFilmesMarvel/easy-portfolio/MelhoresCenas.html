        <section class="form-container">
            <h2>Conte seu momento Marvel favorito</h2>
            <form action="#" method="POST">
                
                <div class="form-group">
                    <label for="nome">Seu Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: Tony Stark" required>
                </div>
                
                
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="Ex: stark@avengers.com" required>
                </div>
                
                
                <div class="form-group">
                    <label for="heroi">Herói Favorito:</label>
                    <select id="heroi" name="heroi">

                        <option value="wanda">Wanda</option>
                        <option value="deadpool">DeadPool</option>
                        <option value="loki">Loki</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>
                
                
                <div class="form-group">
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="4" placeholder="Qual foi o momento mais épico dos filmes da Marvel para você?"></textarea>
                </div>
                
                
                <div class="form-group">
                    <input type="submit" value="Enviar">
                </div>
            </form>
