<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário Marvel</title>
  <link rel="stylesheet" href="index.css">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&display=swap" rel="stylesheet">
</head>
<body class="form">
  <div class="form-container">
    <h2>Contato Marvel</h2>
    <form action="#" method="POST">
      
      <div class="form-group">
        <label for="nome">Seu Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Ex: Tony Stark" required>
      </div>
      
      
      <div class="form-group">
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="Ex: stark@avengers.com" required>
      </div>
      
      
      <div class="form-group">
        <label for="heroi">Herói Favorito:</label>
        <select id="heroi" name="heroi">
          <option value="homem-de-ferro">Homem de Ferro</option>
          <option value="capitao-america">Capitão América</option>
          <option value="thor">Thor</option>
          <option value="viuva-negra">Viúva Negra</option>
          <option value="loki">Loki</option>
          <option value="pantera-negra">Pantera Negra</option>
          <option value="homem-aranha">Homem Aranha</option>
          <option value="deadpool">DeadPool</option>
          <option value="homem-formiga">Homem Formiga</option>
          <option value="wanda">Wanda</option>
          <option value="capita-marvel">Capitã Marvel</option>
          <option value="outro">Outro</option>
        </select>
      </div>
      
      
      <div class="form-group">
        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" rows="4" placeholder="Deixe aqui o seu melhor momento"></textarea>
      </div>
      
      
      <div class="form-group">
        <input type="submit" value="Enviar para os Vingadores">
      </div>
    </form>
  </div>
</body>
</html>
